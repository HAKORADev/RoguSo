name: native
on:
  workflow_dispatch:
    inputs:
      version:
        description: version stamp (empty = read from CHANGELOG.md)
        required: false
        default: ''
permissions:
  contents: write
  actions: write
jobs:
  windows:
    name: build the RoguSo exe (web build embedded)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: resolve the version
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.event.inputs.version }}'
          if (-not $v) {
            foreach ($line in Get-Content CHANGELOG.md) {
              if ($line -match '^## ' -and $line -match '([0-9]+\.[0-9]+\.[0-9]+)') {
                $v = $Matches[1]
                break
              }
            }
          }
          if (-not $v) { $v = '0.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "building version $v"

      - name: set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: fetch the WebView2 SDK
        shell: pwsh
        run: |
          $v = "1.0.2792.45"
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$v" -OutFile wv2.zip
          Expand-Archive -Path wv2.zip -DestinationPath shell/wv2 -Force
          Remove-Item wv2.zip
          Get-ChildItem shell/wv2/build/native | Select-Object Name

      - name: embed the web build into the shell
        shell: pwsh
        run: python tools/embed.py "${{ steps.ver.outputs.version }}"

      - name: compile
        shell: cmd
        working-directory: shell
        run: |
          rc /fo roguaso.res roguaso.rc
          cl /nologo /std:c++20 /O2 /MT /EHsc /DUNICODE /D_UNICODE /DNDEBUG ^
            roguaso.cpp ..\build\embed_data.cpp roguaso.res ^
            /I. /Iwv2\build\native\include ^
            /Fe:..\build\RoguSo.exe ^
            /link wv2\build\native\x64\WebView2LoaderStatic.lib ^
            user32.lib gdi32.lib shell32.lib shlwapi.lib advapi32.lib ole32.lib oleaut32.lib uuid.lib ^
            /SUBSYSTEM:WINDOWS /LTCG

      - name: package the one zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build/roguaso-web -Force | Out-Null
          Copy-Item index.html, sword.png build/roguaso-web/
          Copy-Item src, vendor build/roguaso-web -Recurse
          Compress-Archive -Path build/roguaso-web -DestinationPath build/web.zip
          $name = "RoguSo-${{ steps.ver.outputs.version }}-r${{ github.run_number }}-windows"
          Compress-Archive -Path build/RoguSo.exe, build/web.zip -DestinationPath "build/$name.zip"
          "zipname=$name" >> $env:GITHUB_OUTPUT
          Get-Item "build/$name.zip" | Select-Object Name, Length

      - name: upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoguSo-${{ steps.ver.outputs.version }}-r${{ github.run_number }}-windows
          path: "build/RoguSo-${{ steps.ver.outputs.version }}-r${{ github.run_number }}-windows.zip"

      - name: publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          $zip = "build/RoguSo-${{ steps.ver.outputs.version }}-r${{ github.run_number }}-windows.zip"
          $notes = "RoguSo $tag - build ${{ github.run_number }} (commit ${{ github.sha }}).`n`nThe zip carries RoguSo.exe (the shell: the whole game embedded, double-click and play) and web.zip (the plain browser build). No installer, no dependencies."
          if (-not (gh release view $tag --json id 2>$null)) {
            gh release create $tag $zip --title "RoguSo $tag" --notes $notes
          } else {
            gh release upload $tag $zip --clobber
          }

  clean:
    name: delete the superseded artifacts
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - name: keep only the artifacts of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run='${{ github.run_id }}'
          repo='${{ github.repository }}'
          gh api "repos/$repo/actions/artifacts?per_page=100" --paginate --jq ".artifacts[] | select(.workflow_run.id != $run) | .id" | while read -r id; do
            gh api -X DELETE "repos/$repo/actions/artifacts/$id" && echo "deleted superseded artifact $id"
          done
